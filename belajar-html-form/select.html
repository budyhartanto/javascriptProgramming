<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar Select</title>
  </head>
  <body>
    <!-- select 1 -->
    <form action="">
        <label for="hobby">Hobby :</label>
        <select name="hobby" id="hobby">
            <option value="coding" selected>Coding</option>
            <option value="gaming" selected>Gaming</option>
            <option value="reading" selected>Reading</option>
        </select>
        <button type="submit">Simpan</button>
    </form>
    <br />
    
    <!-- select 2 -->
    <form action="">
        <label for="hobby">Hobby :</label>
        <select name="hobby" id="hobby" multiple size="2">
            <!--ini pakai multiple-->
            <option value="coding" selected>Coding</option>
            <option value="gaming" selected>Gaming</option>
            <option value="reading" selected>Reading</option>
        </select>
        <button type="submit">Simpan</button>
    </form><br>
    
    <!-- select 3 -->
    <form action="">
      <label for="hobby">Hobby</label>
      <select name="hobby" id="hobby">
        <optgroup label="Coding">
            <option value="java">Java</option>
            <option value="php">PHP</option>
            <option value="javascript">Javascript</option>
        </optgroup>
        <optgroup label="Gaming">
            <option value="mobile_legend">Mobile Legend</option>
            <option value="zelda">Zelda</option>
            <option value="pokemon">Pokemon</option>
        </optgroup>
        <optgroup label="Sport">
            <option value="soccers">Soccers</option>
            <option value="badminton"selected>Badminton</option>
            <option value="basket">Basket</option>
        </optgroup>
      </select>
      <button type="submit">Simpan</button>
    </form>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Function</title>
</head>
<body>
    <script>
        //anonymous function masuk dlm variable
        const say = function(name){
            document.writeln(`<p>Hello ${name}</p>`);
        }

        say("Budy");
        say("Tanto");

        function giveMeName(callback){
            callback("Budy");
        }

        giveMeName(say);


        //anonymous function masuk dlm parameter
        giveMeName(function(name){
            document.writeln(`<p>Hi ${name}</p>`);
        });

        giveMeName(function(name){
            document.writeln(`<p>Hi ${name}</p>`);
        });

        giveMeName(function(name){
            document.writeln(`<p>Hi ${name}</p>`);
        });

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Optional Paramater</title>
</head>
<body>
    <script>

        function sayHello(firstName, middleName, lastName) {
            console.log(firstName);
            console.log(middleName);
            console.log(lastName);
        }

        sayHello();
        sayHello("Budy");
        sayHello("Budy", "Hartanto");
        sayHello("Budy", "Hartanto", "Jaya");
        sayHello("Budy", "Hartanto", "Jaya", "Raya");

    </script>
</body>
</html>

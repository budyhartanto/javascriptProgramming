<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Logika di Boolean</title>
</head>
<body>
    <script>

        console.info("Hello" || "");
        console.info("" || []);
        console.info("0" || "NOL");
        console.info(0 || "NOL");
        console.info(null || "NULL");
        console.info(undefined || "UNDEFINED");
        console.info(0 || false);

        const person = {
            firstName: null,
            lastName: "Hartanto"
        };

        const name = person.firstName || person.lastName;
        console.info(name);

        console.info("Hello" && ''); // ''
        console.info("" && []); // ""
        console.info("0" && "NOL"); // NOL
        console.info(0 && "NOL"); // 0
        console.info(null && "NULL"); // null
        console.info(undefined && "UNDEFINED"); // undefined
        console.info("Undefined" && "null"); // null


    </script>
</body>
</html>

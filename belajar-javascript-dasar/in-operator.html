<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Operator</title>
</head>
<body>
    <script>

        const person = {
            firstName: "Budy",
            lastName: "Hartanto"
        };

        if ("lastName" in person) {
            alert(`Hello ${person.lastName}`);
        }else{
            alert("Hello");
        };

        const student = {
            firstName: "Budy",
            middleName: undefined,
            lastName: "Hartanto"
        };

        if ("middleName" in student) {
            alert(`Hello ${student.middleName}`);
        }else{
            alert("Hello Student");
        };

        const names = [null, "Budy", null];
        const result = 0 in names;
        document.writeln(`<p>${result}</p>`);


    </script>
</body>
</html>

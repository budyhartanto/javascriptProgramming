<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure</title>
</head>
<body>
    <script>

        function createAdder(value) {
            const owner = "Budy";

            function add(params) {
                console.info(owner);
                return value + params;
            }

            return add;
        }

        const addTwo = createAdder(2);
        // function addTwo(params) {
        //     console.info("Budy");
        //     return 2 + params;
        // }
        console.info(addTwo(10));
        console.info(addTwo(20));

        const addTen = createAdder(10);
        // function addTwo(params) {
        //     console.info("Budy");
        //     return 10 + params;
        // }
        console.info(addTen(10));
        console.info(addTen(20));

    </script>
</body>
</html>

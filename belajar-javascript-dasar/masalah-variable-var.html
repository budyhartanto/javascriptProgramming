<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masalah Variable Var</title>
</head>
<body>
    <script>

        // gloabl scope
        var i = 20;

        for (var i = 0; i < 10; i++) {
            // local scope
            console.info(`local ${i}`);
        }

        console.info(`Global ${i}`);

    </script>
</body>
</html>

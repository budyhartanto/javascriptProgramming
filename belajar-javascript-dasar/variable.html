<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Variable</title>
  </head>
  <body>
    <script>
      var fullName = "Budy Hartanto";
      var firstName = "Budy";
      var middleName = "H";
      var lastName = "Hartanto";

      document.writeln(fullName);
      document.writeln("</br>");
      document.writeln(firstName);
      document.writeln("</br>");
      document.writeln(middleName);
      document.writeln("</br>");
      document.writeln(lastName);
      document.writeln("</br>");

      var fullName = "Buday";
      document.writeln("</br>");
      document.writeln(fullName);
    </script>
  </body>
</html>

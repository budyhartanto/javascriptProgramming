<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute</title>

    <style>
        /* ubah yang ada target */
        /* a[target]{
            color: red;
        } */

        /* ubah yang ada target="_blank" */
        /* a[target="_blank"]{
            color: red;
        } */

        /* ubah yang element p yang memiliki atribut title yang terdapat kata belajar */
        /* p[title~="belajar"]{
            color: red;
        } */

        /* ubah element p yang memiliki atribut title yang memiliki value "belajar" atau "belajar yang diikuti dengan karakter" */
        /* p[title|="belajar"]{
            color: red;
        } */

        /* ubah element p yang memiliki atribut title yang memilki value dimulai dengan value "belajar"*/
        /* p[title^="belajar"]{
            color: red;
        } */

        /* ubah element p yang memiliki atribut title dengan value diakhiri dengan "belajar" */
        /* p[title$="belajar"]{
            color: red;
        } */

        /* ubah element p yang memiliki atribut title yang mengandung kata "belajar" */
        /* p[title*="belajar"]{
            color: red;
        } */

        /* ubah element pakai selector dengan tidak mengunakan tag */
        /* [title*="belajar"]{
            color: red;
        } */

        .article[title*="belajar"]{
            color: red;
        }
        
    </style>

</head>
<body>
    <a href="" target="_blank">Contoh 1</a>
    <a href="">Contoh 2</a>
    <a href="" target="_self">Contoh 3</a>
    <a href="">Contoh 4</a>
    
    <p title="pemprograman belajar">Ini Artikel</p>
    <p title="belajarpemprograman">Ini Artikel</p>
    <p title="belajar-pemprograman">Ini Artikel</p>
    <p title="pemprograman-belajar">Ini Artikel</p>
    <p title="belajar">Ini Artikel</p>
    <span title="pemprograman belajar">Ini Artikel</span>

    <p class="article" title="belajarpemprograman">Ini Artikel</p>
    <p class="article" title="pemprograman belajar">Ini Artikel</p>
    <p class="article" title="belajar-pemprograman">Ini Artikel</p>
    <p class="article" title="belajar">Ini Artikel</p>
    <p class="article" title="pemprograman">Ini Artikel</p>
    
</body>
</html>

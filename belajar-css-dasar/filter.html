<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter</title>
    <style>
      img {
        width: 500px;
        filter: blur(10px);
      }
      p{
        filter: blur(2px);
      }
    </style>
  </head>
  <body>
    <img src="images/godzilla.png" alt="" />
    <p>
      Lorem ipsum dolor, sit amet consectetur adipisicing elit. Eum aut iste
      animi, eaque harum ut dolorem numquam maiores corrupti, ad, dolor totam
      saepe quas quod unde consequuntur laborum nostrum voluptatibus!
    </p>
  </body>
</html>

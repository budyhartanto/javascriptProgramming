<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color</title>

    <style>
        h1{
            color: #ffc0cb;
        }

        h2{
            color: rgb(0, 128, 0);
        }

        p{
            color: hsl(240, 100%, 50%);
        }
    </style>

</head>
<body>
    <h1>Ini Title</h1>
    <h2>Ini Sub Title</h2>
    <p>Ini Artikel</p>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar Table</title>
  </head>
  <body>
    <h1>Belajar Table</h1>
    <table style="border: 1px solid black;">
        <colgroup>
        <col span="2" style="background-color: yellow;">
        <col style="background-color: aqua;">
        </colgroup>
      <thead>
        <tr>
          <th colspan="2">Nama</th>
          <th>Nilai</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Buday</td>
          <td>Hartanto</td>
          <td>28</td>
        </tr>
      </tbody>
      <tbody>
        <tr>
          <td>Eko</td>
          <td>Purnomo</td>
          <td>40</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td rowspan="2">Total</td>
          <td>Total</td>
          <td>160</td>
        </tr>
        <tr>
          <td>Rata-Rata</td>
          <td>85</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
